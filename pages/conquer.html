<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impossible List — Kishore Prabakar</title>
    <meta name="description" content="A personal lifelong impossible list — ambitious goals, challenges, experiences, and milestones.">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --il-bg: #09090b;
            --il-surface: #111113;
            --il-surface2: #18181b;
            --il-border: rgba(255,255,255,0.06);
            --il-border-hover: rgba(255,255,255,0.14);
            --il-text: #e4e4e7;
            --il-dim: rgba(228,228,231,0.4);
            --il-accent: #a78bfa;
            --il-accent-dim: rgba(167,139,250,0.15);
            --il-green: #4ade80;
            --il-green-dim: rgba(74,222,128,0.12);
            --il-red: #f87171;
            --il-amber: #fbbf24;
            --il-line: rgba(255,255,255,0.06);
            --il-radius: 8px;
        }

        body {
            background: var(--il-bg);
            color: var(--il-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }

        /* ── Page Container ── */
        .il-page {
            max-width: 820px;
            margin: 0 auto;
            padding: 3rem 1.5rem 6rem;
        }

        /* ── Header ── */
        .il-header {
            margin-bottom: 3rem;
        }
        .il-header h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 0.35rem;
        }
        .il-header .il-subtitle {
            font-size: 0.85rem;
            color: var(--il-dim);
            font-weight: 400;
            font-style: italic;
            margin-bottom: 1rem;
        }
        .il-header .il-progress {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--il-dim);
        }
        .il-header .il-progress .il-prog-bar {
            width: 80px;
            height: 3px;
            background: var(--il-border);
            border-radius: 99px;
            overflow: hidden;
        }
        .il-header .il-progress .il-prog-fill {
            height: 100%;
            background: var(--il-accent);
            border-radius: 99px;
            transition: width 0.5s ease;
        }

        /* ── Edit mode indicator ── */
        .il-edit-badge {
            display: none;
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--il-accent-dim);
            border: 1px solid rgba(167,139,250,0.25);
            color: var(--il-accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 0.3rem 0.7rem;
            border-radius: 99px;
            z-index: 100;
            letter-spacing: 0.05em;
        }
        body.authenticated .il-edit-badge { display: flex; }

        .il-logout-btn {
            display: none;
            position: fixed;
            top: 1rem;
            right: 7rem;
            background: transparent;
            border: 1px solid var(--il-border);
            color: var(--il-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            padding: 0.3rem 0.7rem;
            border-radius: 99px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.2s;
        }
        .il-logout-btn:hover { border-color: var(--il-red); color: var(--il-red); }
        body.authenticated .il-logout-btn { display: flex; }

        /* ── Tree ── */
        .il-tree {
            position: relative;
        }

        .il-item {
            position: relative;
        }

        .il-item-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.35rem 0.5rem;
            border-radius: var(--il-radius);
            transition: background 0.15s;
            position: relative;
        }
        .il-item-row:hover {
            background: rgba(255,255,255,0.02);
        }

        /* Expand/collapse toggle */
        .il-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border-radius: 4px;
            transition: background 0.15s, transform 0.2s;
            margin-top: 2px;
            color: var(--il-dim);
        }
        .il-toggle:hover { background: rgba(255,255,255,0.06); color: var(--il-text); }
        .il-toggle svg {
            width: 12px;
            height: 12px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .il-toggle.collapsed svg { transform: rotate(-90deg); }
        .il-toggle.leaf { visibility: hidden; }

        /* Checkbox */
        .il-checkbox {
            width: 17px;
            height: 17px;
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            margin-top: 2px;
        }
        .il-checkbox:hover { border-color: var(--il-green); }
        .il-checkbox.checked {
            background: var(--il-green);
            border-color: var(--il-green);
        }
        .il-checkbox svg { width: 10px; height: 10px; stroke: #000; opacity: 0; transition: opacity 0.15s; }
        .il-checkbox.checked svg { opacity: 1; }
        .il-checkbox.readonly { pointer-events: none; cursor: default; }

        /* Title */
        .il-title {
            flex: 1;
            font-size: 0.88rem;
            line-height: 1.5;
            outline: none;
            min-width: 0;
            word-break: break-word;
        }
        .il-title[contenteditable="true"] {
            border-bottom: 1px solid var(--il-accent);
            padding-bottom: 1px;
        }
        .il-item.completed > .il-item-row .il-title {
            color: var(--il-dim);
            text-decoration: line-through;
            text-decoration-color: rgba(228,228,231,0.2);
        }

        /* Category label (top-level) */
        .il-item.level-0 > .il-item-row .il-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: -0.01em;
        }

        /* Status badge */
        .il-status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            padding: 0.1rem 0.4rem;
            border-radius: 99px;
            flex-shrink: 0;
            letter-spacing: 0.03em;
            margin-top: 3px;
        }
        .il-status-badge.someday { background: rgba(251,191,36,0.1); color: var(--il-amber); }
        .il-status-badge.abandoned { background: rgba(248,113,113,0.1); color: var(--il-red); }

        /* Description */
        .il-desc {
            font-size: 0.78rem;
            color: var(--il-dim);
            padding: 0.15rem 0.5rem 0.15rem 2.7rem;
            line-height: 1.5;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .il-desc.visible { max-height: 200px; opacity: 1; }
        .il-desc[contenteditable="true"] {
            border-bottom: 1px solid var(--il-accent);
            outline: none;
        }

        /* Edit controls (hover-revealed, auth only) */
        .il-controls {
            display: none;
            align-items: center;
            gap: 0.15rem;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s;
        }
        body.authenticated .il-controls { display: flex; }
        .il-item-row:hover .il-controls { opacity: 1; }

        .il-ctrl-btn {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--il-dim);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .il-ctrl-btn:hover { background: rgba(255,255,255,0.06); color: var(--il-text); }
        .il-ctrl-btn.danger:hover { color: var(--il-red); background: rgba(248,113,113,0.1); }
        .il-ctrl-btn svg { width: 13px; height: 13px; }

        /* Status cycle button */
        .il-ctrl-btn .il-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1.5px solid var(--il-dim);
        }
        .il-ctrl-btn .il-status-dot.active { border-color: var(--il-green); background: var(--il-green); }
        .il-ctrl-btn .il-status-dot.someday { border-color: var(--il-amber); background: var(--il-amber); }
        .il-ctrl-btn .il-status-dot.abandoned { border-color: var(--il-red); background: var(--il-red); }

        /* Children container with hierarchy lines */
        .il-children {
            margin-left: 1.1rem;
            padding-left: 1rem;
            border-left: 1px solid var(--il-line);
            position: relative;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease;
        }
        .il-children.collapsed {
            max-height: 0 !important;
            opacity: 0;
            pointer-events: none;
        }

        /* ── Add item row ── */
        .il-add-row {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.5rem;
            margin-left: 1.1rem;
            opacity: 0;
            transition: opacity 0.15s;
        }
        body.authenticated .il-add-row { display: flex; }
        .il-item-row:hover ~ .il-add-row,
        .il-add-row:hover { opacity: 1; }

        .il-add-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--il-border);
            color: var(--il-text);
            font-family: inherit;
            font-size: 0.82rem;
            padding: 0.2rem 0;
            outline: none;
            transition: border-color 0.2s;
        }
        .il-add-input:focus { border-bottom-color: var(--il-accent); }
        .il-add-input::placeholder { color: var(--il-dim); }

        .il-add-btn {
            background: var(--il-accent);
            color: #000;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.15s, transform 0.1s;
        }
        .il-add-input:focus ~ .il-add-btn,
        .il-add-btn:focus { opacity: 1; }
        .il-add-btn:hover { transform: scale(1.1); }

        /* ── Confirm dialog ── */
        .il-confirm {
            position: fixed;
            background: var(--il-surface2);
            border: 1px solid rgba(248,113,113,0.3);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            z-index: 2000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            min-width: 220px;
            display: none;
        }
        .il-confirm.open { display: block; }
        .il-confirm p { font-size: 0.82rem; color: var(--il-dim); margin-bottom: 0.75rem; }
        .il-confirm-btns { display: flex; gap: 0.5rem; }
        .il-confirm-btns button {
            flex: 1;
            padding: 0.4rem;
            border-radius: 6px;
            border: 1px solid var(--il-border);
            background: var(--il-surface);
            color: var(--il-text);
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .il-confirm-btns button.danger { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.3); color: var(--il-red); }
        .il-confirm-btns button:hover { border-color: var(--il-accent); }

        /* ── Auth modal ── */
        .il-auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .il-auth-overlay.open { display: flex; }

        .il-auth-card {
            background: var(--il-surface);
            border: 1px solid var(--il-border);
            border-radius: 14px;
            padding: 2rem;
            width: 100%;
            max-width: 380px;
        }
        .il-auth-card h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }
        .il-auth-card p { font-size: 0.8rem; color: var(--il-dim); margin-bottom: 1.25rem; }
        .il-auth-card input {
            width: 100%;
            background: var(--il-surface2);
            border: 1px solid var(--il-border);
            color: var(--il-text);
            padding: 0.6rem 0.8rem;
            border-radius: 7px;
            font-family: inherit;
            font-size: 0.85rem;
            margin-bottom: 0.6rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .il-auth-card input:focus { border-color: var(--il-accent); }
        .il-auth-card button.auth-primary {
            width: 100%;
            background: var(--il-accent);
            color: #000;
            border: none;
            padding: 0.65rem;
            border-radius: 7px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 0.5rem;
            transition: opacity 0.2s;
        }
        .il-auth-card button.auth-primary:hover { opacity: 0.88; }
        .il-auth-card button.auth-secondary {
            width: 100%;
            background: transparent;
            color: var(--il-dim);
            border: 1px solid var(--il-border);
            padding: 0.55rem;
            border-radius: 7px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .il-auth-card button.auth-secondary:hover { border-color: var(--il-border-hover); color: var(--il-text); }
        .il-auth-card .auth-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--il-dim);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.25rem;
        }

        /* ── Toast ── */
        .il-toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: var(--il-surface2);
            border: 1px solid var(--il-border);
            color: var(--il-text);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.8rem;
            z-index: 9000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }
        .il-toast.show { transform: translateX(-50%) translateY(0); }
        .il-toast.error { border-color: var(--il-red); color: var(--il-red); }
        .il-toast.success { border-color: var(--il-green); color: var(--il-green); }

        /* ── Back to top ── */
        .il-back-link {
            display: inline-block;
            margin-top: 3rem;
            font-size: 0.82rem;
            color: var(--il-dim);
            text-decoration: none;
            transition: color 0.15s;
        }
        .il-back-link:hover { color: var(--il-text); }

        /* ── Loading ── */
        .il-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
            color: var(--il-dim);
            font-size: 0.85rem;
        }

        /* ── Mobile ── */
        @media (max-width: 640px) {
            .il-page { padding: 2rem 1rem 4rem; }
            .il-header h1 { font-size: 1.35rem; }
            .il-children { margin-left: 0.6rem; padding-left: 0.7rem; }
            .il-item-row { gap: 0.35rem; padding: 0.3rem 0.35rem; }
            .il-edit-badge { top: 0.5rem; right: 0.5rem; font-size: 0.6rem; }
            .il-logout-btn { top: 0.5rem; right: 5.5rem; font-size: 0.6rem; }
        }

        /* ── Category accent colors ── */
        .il-item[data-cat="0"] > .il-item-row .il-title { color: #a78bfa; }
        .il-item[data-cat="1"] > .il-item-row .il-title { color: #60a5fa; }
        .il-item[data-cat="2"] > .il-item-row .il-title { color: #4ade80; }
        .il-item[data-cat="3"] > .il-item-row .il-title { color: #fbbf24; }
        .il-item[data-cat="4"] > .il-item-row .il-title { color: #f87171; }
        .il-item[data-cat="5"] > .il-item-row .il-title { color: #c084fc; }
        .il-item[data-cat="6"] > .il-item-row .il-title { color: #fb923c; }
        .il-item[data-cat="7"] > .il-item-row .il-title { color: #34d399; }

        /* Drag indicator */
        .il-drag-handle {
            width: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: grab;
            color: var(--il-dim);
            opacity: 0;
            transition: opacity 0.15s;
            margin-top: 3px;
        }
        .il-item-row:hover .il-drag-handle { opacity: 0.5; }
        .il-drag-handle:hover { opacity: 1 !important; }
        body.authenticated .il-drag-handle { display: flex; }
        body:not(.authenticated) .il-drag-handle { display: none; }
        .il-drag-handle svg { width: 10px; height: 10px; }
        .il-item.dragging { opacity: 0.3; }
        .il-item.drag-over-before > .il-item-row {
            background: var(--il-accent-dim);
            box-shadow: inset 0 2px 0 0 var(--il-accent);
        }
        .il-item.drag-over-after > .il-item-row {
            background: var(--il-accent-dim);
            box-shadow: inset 0 -2px 0 0 var(--il-accent);
        }
        .il-item.drag-over-inside > .il-item-row {
            background: var(--il-accent-dim);
            outline: 1px dashed rgba(167,139,250,0.5);
        }
    </style>
</head>
<body>

    <div class="il-page">
        <header class="il-header">
            <h1>THE IMPOSSIBLE LIST</h1>
            <p class="il-subtitle">things worth doing before i run out of time.</p>
            <div class="il-progress">
                <span id="il-prog-text">0 / 0</span>
                <div class="il-prog-bar"><div class="il-prog-fill" id="il-prog-fill"></div></div>
            </div>
        </header>

        <div id="il-loading" class="il-loading">loading…</div>
        <div id="il-tree" class="il-tree" style="display:none;"></div>

        <a href="/index.html" class="il-back-link">← home</a>
    </div>

    <!-- Edit mode badge -->
    <div class="il-edit-badge">edit mode</div>
    <button class="il-logout-btn" id="il-logout">sign out</button>

    <!-- Auth modal -->
    <div class="il-auth-overlay" id="il-auth-overlay">
        <div class="il-auth-card" style="position:relative;">
            <button class="auth-close" id="il-auth-close">&times;</button>
            <h2>…</h2>
            <p>authenticate to edit your list.</p>
            <input type="email" id="il-auth-email" placeholder="email">
            <input type="password" id="il-auth-pass" placeholder="password">
            <button class="auth-primary" id="il-auth-login">sign in</button>
            <button class="auth-secondary" id="il-auth-signup">create account</button>
        </div>
    </div>

    <!-- Delete confirm -->
    <div class="il-confirm" id="il-confirm">
        <p id="il-confirm-text">delete this item and all children?</p>
        <div class="il-confirm-btns">
            <button id="il-confirm-cancel">cancel</button>
            <button id="il-confirm-ok" class="danger">delete</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="il-toast" id="il-toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/assets/js/conquer.js"></script>
</body>
</html>
