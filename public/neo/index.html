    sec.items.forEach((item, i) => {

}

// ─── DATE HELPERS ─────────────────────────────────────────────────────────────
function toDate(s) { return new Date(s + "T00:00:00"); }
function toStr(d) { return d.toISOString().split("T")[0]; }
function today() { return toStr(new Date()); }
function daysLeft() { return Math.max(0, Math.ceil((toDate(END_DATE) - new Date()) / 86400000)); }

function allDates() {
  const out = [];
  for (let d = new Date(toDate(START_DATE)); d <= toDate(END_DATE); d.setDate(d.getDate() + 1))
    out.push(toStr(d));
  return out;
}

const DATES = allDates();

function dayIndex(dateStr) {
  return DATES.indexOf(dateStr);
}

// Items assigned to a day — deterministic by index
function itemsForDay(dateStr) {
  const idx = dayIndex(dateStr);
  if (idx < 0) return [];
  return CURRICULUM.filter((_, i) => i % DATES.length === idx);
}

function habitsForDate(dateStr) {
  const dow = toDate(dateStr).getDay();
  return { daily: DAILY_HABITS, weekly: WEEKLY_HABITS.filter(h => h.day === dow) };
}

function totalHabitsForDate(dateStr) {
  const { daily, weekly } = habitsForDate(dateStr);
  return daily.length + weekly.length;
}

function completedHabits(dateStr, checked) {
  const { daily, weekly } = habitsForDate(dateStr);
  return [...daily, ...weekly].filter(h => checked[h.id]).length;
}

function habitPct(dateStr, checked) {
  const t = totalHabitsForDate(dateStr);
  return t ? Math.round((completedHabits(dateStr, checked) / t) * 100) : 0;
}

function isFullDay(dateStr, checked) { return habitPct(dateStr, checked) === 100; }

// ─── STORAGE (localStorage) ───────────────────────────────────────────────────
function lsGet(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

async function loadDay(d) {
  return lsGet("day:" + d) || { checked: {} };
}
async function saveDay(d, data) {
  lsSet("day:" + d, data);
}
async function loadStudied() {
  return lsGet("studied_items") || {};
}
async function saveStudied(s) {
  lsSet("studied_items", s);
}
async function loadMeta() {
  return lsGet("placement_meta") || { streak: 0, bestStreak: 0 };
}
async function saveMeta(m) {
  lsSet("placement_meta", m);
}
async function loadRevisions() {
  return lsGet("revisions") || {};
}
async function saveRevisions(r) {
  lsSet("revisions", r);
}

function cellColor(pct, isFuture) {
  if (isFuture) return "#0f0f0f";
  if (pct === 0) return "#161616";
  if (pct < 50)  return "#2d1a0a";
  if (pct < 100) return "#1a2d1a";
  return "#14532d";
}
function cellBorder(pct, isToday) {
  if (isToday) return "1.5px solid #a78bfa";
  return "1px solid #1e1e1e";
}

// ─── COUNTDOWN CLOCK ─────────────────────────────────────────────────────────
function CountdownClock({ endDate }) {
  const [timeLeft, setTimeLeft] = useState(null);

  useEffect(() => {
    function calc() {
      const now = new Date();
      const end = new Date(endDate + "T23:59:59");
      const diff = end - now;
      if (diff <= 0) return setTimeLeft({ d:0, h:0, m:0, s:0, pct:100 });
      const totalSecs = (end - new Date(START_DATE + "T00:00:00")) / 1000;
      const remainSecs = diff / 1000;
      const pct = Math.round(((totalSecs - remainSecs) / totalSecs) * 100);
      setTimeLeft({
        d: Math.floor(diff / 86400000),
        h: Math.floor((diff % 86400000) / 3600000),
        m: Math.floor((diff % 3600000) / 60000),
        s: Math.floor((diff % 60000) / 1000),
        pct,
      });
    }
    calc();
    const t = setInterval(calc, 1000);
    return () => clearInterval(t);
  }, [endDate]);

  if (!timeLeft) return null;
  const urgent = timeLeft.d <= 10;
  const accent = urgent ? "#f87171" : "#a78bfa";
  const arc = 2 * Math.PI * 40;
  const dash = arc - (arc * timeLeft.pct / 100);

  return (
    <div style={{ background: "rgba(20, 20, 20, 0.4)", backdropFilter: "blur(10px)", border: `1px solid ${urgent ? "rgba(248, 113, 113, 0.2)" : "rgba(167, 139, 250, 0.1)"}`, borderRadius: 16, padding: "20px", marginBottom: 24, display: "flex", alignItems: "center", gap: 20 }}>
      {/* Circular arc progress */}
      <div style={{ flexShrink: 0, position: "relative", width: 72, height: 72 }}>
        <svg width="72" height="72" style={{ transform: "rotate(-90deg)" }}>
          <circle cx="36" cy="36" r="30" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="6" />
          <circle cx="36" cy="36" r="30" fill="none" stroke={accent} strokeWidth="6"
            strokeDasharray={`${2 * Math.PI * 30}`}
            strokeDashoffset={`${2 * Math.PI * 30 * (1 - timeLeft.pct / 100)}`}
            strokeLinecap="round"
            style={{ transition: "stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1)" }}
          />
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontSize: 16, fontWeight: 800, color: accent, lineHeight: 1 }}>{timeLeft.d}</span>
          <span style={{ fontSize: 9, color: "rgba(255,255,255,0.3)", letterSpacing: 1 }}>days</span>
        </div>
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", letterSpacing: 2, textTransform: "uppercase", marginBottom: 6, fontWeight: 600 }}>
          {urgent ? "⚡ FINAL STRETCH" : "TIME REMAINING"}
        </div>
        <div style={{ display: "flex", gap: 12, alignItems: "baseline" }}>
          {[["h", timeLeft.h], ["m", timeLeft.m], ["s", timeLeft.s]].map(([unit, val]) => (
            <div key={unit} style={{ textAlign: "center" }}>
              <span style={{ fontSize: 20, fontWeight: 800, color: "#fff", fontVariantNumeric: "tabular-nums" }}>
                {String(val).padStart(2, "0")}
              </span>
              <span style={{ fontSize: 10, color: "rgba(255,255,255,0.3)", marginLeft: 2 }}>{unit}</span>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 8, background: "rgba(255,255,255,0.03)", borderRadius: 10, height: 4, overflow: "hidden" }}>
          <div style={{ width: `${timeLeft.pct}%`, height: "100%", background: accent, transition: "width 1s linear" }} />
        </div>
        <div style={{ fontSize: 10, color: "rgba(255,255,255,0.2)", marginTop: 5 }}>{timeLeft.pct}% of prep time used</div>
      </div>
    </div>
  );
}

// Mock test topic guidance by day-of-week
function getMockGuidance(dateStr) {
  const dow = toDate(dateStr).getDay();
  const isPhase2 = dateStr >= PHASE_CUT;
  if (dow === 1) { // Monday DSA Mock
    return isPhase2
      ? ["Arrays + Strings (Two Pointer, Sliding Window)", "Trees / Graphs BFS/DFS", "DP (Knapsack, LCS variants)", "Stack/Queue monotonic patterns"]
      : ["Two Pointer / Sliding Window", "Binary Search on answer", "Linked List + Stack patterns"];
  }
  if (dow === 5) { // Friday System Design Mock
    return isPhase2
      ? ["Design URL Shortener (scale to 100M req/day)", "Notification System (push, email, SMS fanout)", "RAG pipeline + vector store design", "Webhook delivery system with retry + DLQ"]
      : ["Load balancer + CDN setup", "API Gateway + Rate Limiting", "CQRS + Outbox pattern"];
  }
  return null;
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("today");
  const [todayChecked, setTodayChecked] = useState({});
  const [historyData, setHistoryData] = useState({});
  const [studied, setStudied] = useState({});
  const [revisions, setRevisions] = useState({}); // { itemId: { r1: dateStr, r2: dateStr, r3: dateStr } }
  const [meta, setMeta] = useState({ streak: 0, bestStreak: 0 });
  const [loading, setLoading] = useState(true);
  const [selectedDay, setSelectedDay] = useState(null);
  const [currTab, setCurrTab] = useState("dsa");
  const [currFilter, setCurrFilter] = useState("all");
  const [search, setSearch] = useState("");

  const T = today();

  useEffect(() => {
    async function init() {
      const [todayData, studiedData, m, revisionsData] = await Promise.all([loadDay(T), loadStudied(), loadMeta(), loadRevisions()]);
      setTodayChecked(todayData.checked || {});
      setStudied(studiedData);
      setRevisions(revisionsData);
      setMeta(m);
      const hist = {};
      await Promise.all(DATES.filter(d => d < T).map(async d => {
        const data = await loadDay(d);
        hist[d] = { checked: data.checked || {} };
      }));
      setHistoryData(hist);
      setLoading(false);
    }
    init();
  }, []);

  // Recalculate streak
  useEffect(() => {
    if (loading) return;
    let cur = 0, best = meta.bestStreak || 0;
    for (const d of DATES) {
      if (d > T) break;
      const chk = d === T ? todayChecked : (historyData[d]?.checked || {});
      if (isFullDay(d, chk)) { cur++; if (cur > best) best = cur; }
      else cur = 0;
    }
    const nm = { streak: cur, bestStreak: best };
    setMeta(nm);
    saveMeta(nm);
  }, [todayChecked, historyData, loading]);

  async function toggleHabit(id) {
    const next = { ...todayChecked, [id]: !todayChecked[id] };
    setTodayChecked(next);
    await saveDay(T, { checked: next, savedAt: Date.now() });
  }

  async function toggleStudied(id) {
    const next = { ...studied, [id]: !studied[id] };
    setStudied(next);
    await saveStudied(next);
    // Store/clear the studied date in revisions
    const itemRevs = revisions[id] || {};
    if (!studied[id]) {
      // marking as studied — record studiedDate if not already set
      if (!itemRevs._studiedDate) {
        const updated = { ...revisions, [id]: { ...itemRevs, _studiedDate: T } };
        setRevisions(updated);
        await saveRevisions(updated);
      }
    } else {
      // unmarking — clear all revision data
      const updated = { ...revisions };
      delete updated[id];
      setRevisions(updated);
      await saveRevisions(updated);
    }
  }

  async function toggleRevision(id, rev) {
    // rev = "r1" | "r2" | "r3"
    const itemRevs = revisions[id] || {};
    let next;
    if (itemRevs[rev]) {
      // untoggle
      const r = { ...itemRevs };
      delete r[rev];
      next = { ...revisions, [id]: r };
    } else {
      next = { ...revisions, [id]: { ...itemRevs, [rev]: T } };
    }
    setRevisions(next);
    await saveRevisions(next);
  }

  // Compute next revision date for an item
  function getNextRevDate(itemId) {
    const revItem = revisions[itemId] || {};
    const studiedDate = revItem._studiedDate;
    if (!studiedDate) return null;
    if (!revItem.r1) {
      const d = new Date(studiedDate + "T00:00:00");
      d.setDate(d.getDate() + 1);
      return { tag: "R1", date: toStr(d) };
    }
    if (!revItem.r2) {
      const d = new Date(revItem.r1 + "T00:00:00");
      d.setDate(d.getDate() + 3);
      return { tag: "R2", date: toStr(d) };
    }
    if (!revItem.r3) {
      const d = new Date(revItem.r2 + "T00:00:00");
      d.setDate(d.getDate() + 7);
      return { tag: "R3", date: toStr(d) };
    }
    return null; // all done
  }

  // Compute items due for revision today
  function getRevisionsDueToday() {
    const due = [];
    CURRICULUM.forEach(item => {
      if (!studied[item.id]) return;
      const next = getNextRevDate(item.id);
      if (!next) return;
      if (next.date <= T) {
        const revItem = revisions[item.id] || {};
        let note = "";
        if (next.tag === "R1") note = `due since ${revItem._studiedDate ? revItem._studiedDate.slice(5) : "?"}+1d`;
        else if (next.tag === "R2") note = `due since ${revItem.r1 ? revItem.r1.slice(5) : "?"}+3d`;
        else if (next.tag === "R3") note = `due since ${revItem.r2 ? revItem.r2.slice(5) : "?"}+7d`;
        due.push({ ...item, revTag: next.tag, note });
      }
    });
    return due.slice(0, 20);
  }

  const revisionsDueToday = getRevisionsDueToday();

  // Today's curriculum items
  const todayItems = itemsForDay(T);

  // Auto-derive habit state from studied topics today
  const todayDsaStudied  = todayItems.filter(it => it.type === "dsa"  && studied[it.id]).length;
  const todayCoreStudied = todayItems.filter(it => it.type === "core" && studied[it.id]).length;
  const todayDsaTotal    = todayItems.filter(it => it.type === "dsa").length;
  const todayCoreTotal   = todayItems.filter(it => it.type === "core").length;

  // lc1: ≥1 DSA done, lc2: ≥2 DSA done, lc3: all DSA done for today
  function derivedHabitDone(habitId) {
    if (habitId === "lc1")  return todayDsaStudied >= 1;
    if (habitId === "lc2")  return todayDsaStudied >= 2;
    if (habitId === "lc3")  return todayDsaTotal > 0 && todayDsaStudied >= todayDsaTotal;
    if (habitId === "cs")   return todayCoreStudied >= 1;
    return null; // not auto
  }

  // Effective checked state: auto habits use derived value
  function effectiveChecked(habitId) {
    const derived = derivedHabitDone(habitId);
    if (derived !== null) return derived;
    return !!todayChecked[habitId];
  }

  // For streak/progress counting, merge auto state into checked map
  const effectiveCheckedMap = { ...todayChecked };
  DAILY_HABITS.forEach(h => {
    if (h.auto) effectiveCheckedMap[h.id] = derivedHabitDone(h.id);

  const todayStudied = todayItems.filter(it => studied[it.id]).length;

  if (loading) return (
    <div style={{ background: "#090909", minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <span style={{ color: "#333", fontFamily: "monospace", fontSize: 13 }}>loading...</span>
    </div>
  );

  return (
    <div style={{ background: "#090909", minHeight: "100vh", fontFamily: "'Inter', system-ui, sans-serif", color: "#e0e0e0" }}>

        {/* ── HEADER ── */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 32 }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: 4, textTransform: "uppercase", color: "rgba(255,255,255,0.4)", marginBottom: 6, fontWeight: 500 }}>Kishore Prabakar</div>
            <div style={{ fontSize: 28, fontWeight: 800, color: "#fff", lineHeight: 1.1, letterSpacing: "-0.02em" }}>Placement Prep</div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.3)", marginTop: 6, fontWeight: 500 }}>{T}</div>
          </div>
          <div style={{ textAlign: "right", maxWidth: 200 }}>
            <div style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", fontStyle: "italic", lineHeight: 1.5, fontWeight: 400 }}>
              "Stay hungry,<br/>stay foolish."
            </div>
            <div style={{ fontSize: 10, color: "rgba(255,255,255,0.2)", marginTop: 6, letterSpacing: 1, fontWeight: 600 }}>— Steve Jobs</div>
          </div>
        </div>

        {/* ── STAT CARDS ── */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8, marginBottom: 20 }}>
          <StatCard label="Streak" value={`${meta.streak}🔥`} accent="#a78bfa" />
          <StatCard label="Best" value={meta.bestStreak} accent="#60a5fa" />
          <StatCard label="Perfect" value={`${perfectDays}d`} accent="#4ade80" />

        </div>

        {/* ── TABS ── */}
        <div style={{ display: "flex", gap: 2, background: "#111", borderRadius: 10, padding: 3, marginBottom: 20 }}>
          {[["today","Today"],["curriculum","Curriculum"],["progress","Progress"]].map(([v,l]) => (

              </div>

            {/* Sub-tabs */}
            <div style={{ display: "flex", gap: 2, background: "#111", borderRadius: 8, padding: 3, marginBottom: 14 }}>
              {[["dsa","DSA Patterns"],["core","Core Subjects"]].map(([v,l]) => (
                <button key={v} onClick={() => setCurrTab(v)} style={{
                  flex:1, padding:"7px 0", borderRadius:6, border:"none", cursor:"pointer",
                  background: currTab===v ? "#1d1d1d" : "transparent",
                  color: currTab===v ? "#fff" : "#4a4a4a",
                  fontWeight: currTab===v ? 600 : 400, fontSize:12, transition:"all 0.15s",
                }}>{l}</button>
              ))}
            </div>

            {/* Filter + search */}
            <div style={{ display:"flex", gap:6, marginBottom:14, flexWrap:"wrap" }}>
              {["all","remaining","done","rev-due"].map(f => (
                <button key={f} onClick={() => setCurrFilter(f)} style={{
                  padding:"6px 14px", borderRadius:8, border:`1px solid ${currFilter===f?"rgba(167, 139, 250, 0.4)":"rgba(255,255,255,0.05)"}`,
                  background: currFilter===f ? "rgba(167, 139, 250, 0.1)" : "transparent",
                  color: currFilter===f ? "#a78bfa" : "rgba(255,255,255,0.3)",
                  fontSize:12, cursor:"pointer", fontWeight: 600, transition: "all 0.2s"
                }}>{f === "rev-due" ? "🔁 rev due" : f}</button>
              ))}
              <input
                value={search} onChange={e => setSearch(e.target.value)}
                placeholder="Search..."
                style={{ flex:1, background:"#111", border:"1px solid #1e1e1e", borderRadius:6, padding:"5px 10px", color:"#ccc", fontSize:11, outline:"none" }}
              />
            </div>

            {/* Sections */}
            {(currTab === "dsa" ? DSA_SECTIONS : CORE_SECTIONS).map(sec => {
              const secItems = sec.items.map((item,i) => ({
                id: `${currTab}_${sec.id}_${i}`, type: currTab, sectionId: sec.id, sectionLabel: sec.label, item
              }));
              const filtered = secItems.filter(it => {
                if (currFilter === "remaining" && studied[it.id]) return false;
                if (currFilter === "done" && !studied[it.id]) return false;
                if (currFilter === "rev-due") {
                  if (!studied[it.id]) return false;
                  const next = getNextRevDate(it.id);
                  if (!next || next.date > T) return false;
                }
                if (search && !it.item.toLowerCase().includes(search.toLowerCase())) return false;
                return true;
              });
              if (!filtered.length) return null;
              const doneCnt = secItems.filter(it => studied[it.id]).length;
              const secPct = Math.round(doneCnt / secItems.length * 100);
              return (
                <div key={sec.id} style={{ marginBottom:16 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                    <span style={{ fontSize:12, fontWeight:700, color: secPct===100?"#4ade80":"rgba(255,255,255,0.6)", letterSpacing:0.5 }}>{sec.label}</span>
                    <span style={{ fontSize:11, color: secPct===100?"#4ade80":secPct>60?"#a78bfa":"rgba(255,255,255,0.2)", fontWeight: 600 }}>{doneCnt} <span style={{ color: "rgba(255,255,255,0.1)", fontWeight: 400 }}>/</span> {secItems.length}</span>
                  </div>
                  <div style={{ background:"#131313", borderRadius:2, height:2, marginBottom:8 }}>
                    <div style={{ width:`${secPct}%`, height:"100%", borderRadius:2, background: secPct===100?"#4ade80":secPct>50?"#7c3aed":"#b45309", transition:"width 0.4s" }} />
                  </div>
                  {filtered.map(it => (
                    <TopicRow key={it.id} item={it} done={!!studied[it.id]} onToggle={() => toggleStudied(it.id)}
                      revisions={revisions[it.id] || {}} onRevision={(rev) => toggleRevision(it.id, rev)}
                      nextRevDate={studied[it.id] ? getNextRevDate(it.id) : null} />
                  ))}
                </div>
              );
            })}
          </>
        )}

        {/* ════════════ PROGRESS VIEW ════════════ */}
        {view === "progress" && !selectedDay && (
          <>
            {/* Overall curriculum progress */}
            <div style={{ background:"#111", border:"1px solid #1e1e1e", borderRadius:10, padding:"14px 16px", marginBottom:16 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                <span style={{ fontSize:12, color:"#888" }}>Overall curriculum</span>
                <span style={{ fontSize:12, fontWeight:700, color:"#fb923c" }}>{studiedCount}/{totalItems}</span>
              </div>
              <ProgressBar pct={studiedPct} color="#fb923c" />
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginTop:12 }}>
                {[
                  ["DSA Patterns", DSA_SECTIONS],
                  ["Core Subjects", CORE_SECTIONS],
                ].map(([label, sections]) => {
                  const ids = sections.flatMap((s,_) => s.items.map((_,i) => `${label==="DSA Patterns"?"dsa":"core"}_${s.id}_${i}`));
                  const done = ids.filter(id => studied[id]).length;
                  const pct = Math.round(done/ids.length*100);
                  return (
                    <div key={label} style={{ background:"#161616", borderRadius:7, padding:"10px 12px" }}>
                      <div style={{ fontSize:10, color:"#555", marginBottom:4 }}>{label}</div>
                      <div style={{ fontSize:18, fontWeight:700, color: pct>70?"#4ade80":pct>40?"#a78bfa":"#888" }}>{pct}%</div>
                      <div style={{ fontSize:10, color:"#444", marginTop:2 }}>{done}/{ids.length}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Calendar heatmap */}
            <SectionHdr label="Daily Habit Calendar" />
            <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:4, marginBottom:6 }}>
              {["S","M","T","W","T","F","S"].map((d,i) => (
                <div key={i} style={{ textAlign:"center", fontSize:9, color:"#2a2a2a", paddingBottom:3 }}>{d}</div>
              ))}
              {Array.from({ length: toDate(START_DATE).getDay() }).map((_,i) => <div key={"p"+i} />)}
              {DATES.map(d => {
                const isFuture = d > T, isToday = d === T;
                const chk = isToday ? todayChecked : (historyData[d]?.checked || {});
                const pct = habitPct(d, chk);
                return (
                  <div key={d} onClick={() => !isFuture && setSelectedDay(d)} title={`${d}: ${pct}%`} style={{
                    aspectRatio:"1", borderRadius:6,
                    background: cellColor(pct, isFuture),
                    border: cellBorder(pct, isToday),
                    cursor: isFuture ? "default" : "pointer",
                    display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column",
                    transition: "transform 0.1s"
                  }}>
                    <span style={{ fontSize:11, fontWeight: isToday?800:600, color: isFuture?"rgba(255,255,255,0.05)": pct===100?"#4ade80": pct>0?"rgba(255,255,255,0.5)":"rgba(255,255,255,0.1)" }}>{toDate(d).getDate()}</span>
                    {!isFuture && pct>0 && <span style={{ fontSize:8, color: pct===100?"#4ade80":"rgba(255,255,255,0.3)", fontWeight: 700 }}>{pct===100?"✓":`${pct}%`}</span>}
                  </div>
                );
              })}
            </div>
            <div style={{ display:"flex", gap:10, marginBottom:20, flexWrap:"wrap" }}>
              {[["#161616","0%"],["rgba(251, 146, 60, 0.2)","1–49%"],["rgba(74, 222, 128, 0.2)","50–99%"],["#14532d","100%"]].map(([bg,l]) => (
                <div key={l} style={{ display:"flex", alignItems:"center", gap:6, fontSize:11, color:"rgba(255,255,255,0.3)", fontWeight: 500 }}>
                  <div style={{ width:10, height:10, borderRadius:3, background:bg, border:"1px solid rgba(255,255,255,0.05)" }} />
                  {l}
                </div>
              ))}
            </div>

            {/* Per-habit stats */}
            <SectionHdr label="Habit Consistency" />
            {[...DAILY_HABITS, ...WEEKLY_HABITS].map(h => {
              const relevantDays = DATES.filter(d => {
                if (d > T) return false;
                const { daily, weekly } = habitsForDate(d);
                return [...daily, ...weekly].some(x => x.id === h.id);
              });
              const done = relevantDays.filter(d => {
                const chk = d === T ? todayChecked : (historyData[d]?.checked || {});
                return !!chk[h.id];
              }).length;
              const total = relevantDays.length;
              const pct = total ? Math.round(done/total*100) : 0;
              return (
                <div key={h.id} style={{ padding:"12px 0", borderBottom:"1px solid rgba(255,255,255,0.03)" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8, alignItems: "baseline" }}>
                    <span style={{ fontSize:13, color:"rgba(255,255,255,0.6)", fontWeight: 500 }}>{h.label}</span>
                    <span style={{ fontSize:12, color: pct===100?"#4ade80":pct>60?"#a78bfa":"rgba(255,255,255,0.2)", fontWeight: 700 }}>
                      {done} <span style={{ color: "rgba(255,255,255,0.1)", fontWeight: 400 }}>/</span> {total}
                    </span>
                  </div>
                  <div style={{ background:"rgba(255,255,255,0.03)", borderRadius:10, height:4 }}>
                    <div style={{ width:`${pct}%`, height:"100%", borderRadius:10, background: pct===100?"#4ade80":pct>60?"#7c3aed":"#b45309", transition:"width 0.4s" }} />
                  </div>
                </div>
              );
            })}
          </>
        )}

        {/* Day detail */}
        {view === "progress" && selectedDay && (
          <DayDetail
            dateStr={selectedDay}
            checked={selectedDay === T ? todayChecked : (historyData[selectedDay]?.checked || {})}
            studiedItems={studied}
            onBack={() => setSelectedDay(null)}
          />
        )}

      </div>
    </div>
  );
}

// ─── SUB COMPONENTS ───────────────────────────────────────────────────────────

function StatCard({ label, value, sub, accent }) {
  return (
    <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.05)", borderRadius:12, padding:"12px 14px", backdropFilter: "blur(5px)" }}>
      <div style={{ fontSize:10, color:"rgba(255,255,255,0.3)", textTransform:"uppercase", letterSpacing:1.5, marginBottom:6, fontWeight: 600 }}>{label}</div>
      <div style={{ fontSize:20, fontWeight:800, color:accent, lineHeight:1 }}>{value}</div>
      {sub && <div style={{ fontSize:11, color:"rgba(255,255,255,0.25)", marginTop:6, fontWeight: 500 }}>{sub}</div>}
    </div>
  );
}

function Banner({ children, color, bg, border }) {
  return (
    <div style={{ marginBottom:16, padding:"10px 14px", background:bg, border:`1px solid ${border}`, borderRadius:8, fontSize:12, color, lineHeight:1.6 }}>
      {children}
    </div>
  );
}

function SectionHdr({ label }) {
  return (
    <div style={{ fontSize:11, letterSpacing:3, textTransform:"uppercase", color:"rgba(255,255,255,0.25)", marginTop:32, marginBottom:16, paddingBottom:8, borderBottom:"1px solid rgba(255,255,255,0.05)", fontWeight: 600 }}>
      {label}
    </div>
  );
}

function ProgressBar({ pct, color }) {
  const c = color || (pct === 100 ? "#4ade80" : "#7c3aed");
  return (
    <div style={{ background:"#161616", borderRadius:4, height:5 }}>
      <div style={{ width:`${pct}%`, height:"100%", borderRadius:4, background: pct===100&&!color?"#4ade80":c, transition:"width 0.4s" }} />
    </div>
  );
}

function HabitRow({ habit, done, onToggle, dim=false, tag }) {
  return (
    <div onClick={dim ? undefined : onToggle} style={{ display:"flex", alignItems:"flex-start", gap:14, padding:"12px 0", borderBottom:"1px solid rgba(255,255,255,0.03)", cursor:dim?"default":"pointer", opacity:dim?0.2:1 }}>
      <div style={{ width:18, height:18, borderRadius:5, flexShrink:0, marginTop:2, border:done?"2px solid #4ade80":"2.5px solid rgba(255,255,255,0.1)", background:done?"#4ade80":"transparent", display:"flex", alignItems:"center", justifyContent:"center", transition:"all 0.2s" }}>
        {done && <svg width="10" height="8" viewBox="0 0 9 7"><path d="M1 3L3.5 6L8 1" stroke="#000" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      </div>
      <div style={{ flex:1 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          <span style={{ fontSize:15, fontWeight:700, color:done?"#4ade80":"#fff", textDecoration:done?"line-through":"none", textDecorationColor:"rgba(74, 222, 128, 0.3)", letterSpacing: "-0.01em" }}>{habit.label}</span>
          {tag && <span style={{ fontSize:10, color:"rgba(255,255,255,0.3)", background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:4, padding:"2px 7px", fontWeight: 600 }}>{tag}</span>}
        </div>
        <div style={{ fontSize:12, color:done?"rgba(74, 222, 128, 0.4)":"rgba(255,255,255,0.4)", marginTop:4, lineHeight:1.6, fontWeight: 400 }}>{habit.detail}</div>
      </div>
    </div>
  );
}

function TopicRow({ item, done, onToggle, revisions = {}, onRevision, nextRevDate }) {
  const revTags = ["r1", "r2", "r3"];
  const showRevTags = done;
  const allDone = revisions.r1 && revisions.r2 && revisions.r3;
  return (
    <div style={{ padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.03)" }}>
      <div onClick={onToggle} style={{ display: "flex", alignItems: "flex-start", gap: 12, cursor: "pointer" }}>
        <div style={{ width: 16, height: 16, borderRadius: 5, flexShrink: 0, marginTop: 1,
          border: done ? "2px solid #4ade80" : "1.5px solid rgba(255,255,255,0.1)",
          background: done ? "#4ade80" : "transparent",
          display: "flex", alignItems: "center", justifyContent: "center", transition: "all 0.2s" }}>
          {done && <svg width="9" height="7" viewBox="0 0 8 6"><path d="M1 2.5L3 5L7 1" stroke="#000" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
        </div>
        <span style={{ fontSize: 13, color: done ? (allDone ? "rgba(74, 222, 128, 0.4)" : "rgba(74, 222, 128, 0.7)") : "rgba(255,255,255,0.7)",
          textDecoration: done ? "line-through" : "none", textDecorationColor: "rgba(74, 222, 128, 0.2)", lineHeight: 1.5, flex: 1, letterSpacing: "-0.01em", fontWeight: 500 }}>
          {item.item}
        </span>
      </div>
      {showRevTags && onRevision && (
        <div style={{ display: "flex", gap: 6, marginTop: 8, paddingLeft: 28, flexWrap: "wrap", alignItems: "center" }}>
          {revTags.map(rev => {
            const isDone = !!revisions[rev];
            return (
              <button key={rev} onClick={() => onRevision(rev)} style={{
                fontSize: 10, fontWeight: 700, padding: "3px 9px", borderRadius: 6, cursor: "pointer",
                border: `1px solid ${isDone ? "rgba(167, 139, 250, 0.3)" : "rgba(255,255,255,0.05)"}`,
                background: isDone ? "rgba(167, 139, 250, 0.1)" : "transparent",
                color: isDone ? "#a78bfa" : "rgba(255,255,255,0.2)",
                transition: "all 0.15s",
              }}>{rev.toUpperCase()} {isDone ? `✓ ${revisions[rev].slice(5)}` : "○"}</button>
            );
          })}
          {nextRevDate && !allDone && (
            <span style={{ fontSize: 10, color: nextRevDate.date === new Date().toISOString().split("T")[0] ? "#f59e0b" : "rgba(255,255,255,0.15)", marginLeft: 4, fontWeight: 500 }}>
              next: {nextRevDate.tag} on {nextRevDate.date.slice(5)}
            </span>
          )}
          {allDone && <span style={{ fontSize: 10, color: "rgba(167, 139, 250, 0.4)", marginLeft: 4, fontWeight: 500 }}>✦ all revisions done</span>}
        </div>
      )}
    </div>
  );
}

function DayDetail({ dateStr, checked, studiedItems, onBack }) {
  const { daily, weekly } = habitsForDate(dateStr);
  const all = [...daily, ...weekly];
  const done = all.filter(h => checked[h.id]).length;
  const pct = habitPct(dateStr, checked);
  const dayItems = itemsForDay(dateStr);
  const dayStudied = dayItems.filter(it => studiedItems[it.id]).length;
  const dayNames = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  return (
    <div>
      <button onClick={onBack} style={{ background:"none", border:"none", color:"#a78bfa", fontSize:12, cursor:"pointer", padding:"0 0 14px 0", display:"flex", alignItems:"center", gap:5 }}>
        ← Back to calendar
      </button>
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:10, color:"#444", marginBottom:3 }}>{dayNames[toDate(dateStr).getDay()]}</div>
        <div style={{ fontSize:18, fontWeight:700, color:"#fff" }}>{dateStr}</div>
        <div style={{ marginTop:8, display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ flex:1, background:"#161616", borderRadius:3, height:4 }}>
            <div style={{ width:`${pct}%`, height:"100%", borderRadius:3, background:pct===100?"#4ade80":pct>60?"#7c3aed":"#b45309" }} />
          </div>
          <span style={{ fontSize:12, color:pct===100?"#4ade80":"#666", fontWeight:600 }}>Habits {done}/{all.length}</span>
        </div>
      </div>

      <SectionHdr label="Habits" />
      {all.map(h => (
        <div key={h.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 0", borderBottom:"1px solid rgba(255,255,255,0.03)" }}>
          <div style={{ width:15, height:15, borderRadius:4, background:checked[h.id]?"#4ade80":"transparent", border:checked[h.id]?"none":"1.5px solid rgba(255,255,255,0.1)", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center" }}>
            {checked[h.id] && <svg width="9" height="7"><path d="M1 2.5L3 5L6 1" stroke="#000" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
          </div>
          <span style={{ fontSize:14, color:checked[h.id]?"#4ade80":"rgba(255,255,255,0.5)", fontWeight: 500 }}>{h.label}</span>
          {"dayName" in h && <span style={{ fontSize:10, color:"rgba(255,255,255,0.2)", marginLeft:"auto", fontWeight: 600 }}>{h.dayName}</span>}
        </div>
      ))}

      {dayItems.length > 0 && <>
        <SectionHdr label={`Study Topics — ${dayStudied}/${dayItems.length} studied`} />
        {dayItems.map(it => (
          <div key={it.id} style={{ display:"flex", alignItems:"flex-start", gap:12, padding:"10px 0", borderBottom:"1px solid rgba(255,255,255,0.03)" }}>
            <div style={{ width:14, height:14, borderRadius:4, background:studiedItems[it.id]?"#4ade80":"transparent", border:studiedItems[it.id]?"none":"1.5px solid rgba(255,255,255,0.1)", flexShrink:0, marginTop:2 }} />
            <span style={{ fontSize:13, color:studiedItems[it.id]?"rgba(74, 222, 128, 0.6)":"rgba(255,255,255,0.5)", lineHeight:1.5, fontWeight: 500 }}>{it.item}</span>
            <span style={{ fontSize:10, color:"rgba(255,255,255,0.2)", marginLeft:"auto", flexShrink:0, fontWeight: 600 }}>{it.sectionLabel}</span>
          </div>
        ))}
      </>}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
